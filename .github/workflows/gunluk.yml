name: Günlük haber havuzu

on:
  schedule:
    - cron: "7 5 * * *"   # her gün 08:07 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  havuz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Haberleri topla, puanla, fotoğrafla
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node havuz.mjs
      - name: Sonucu kaydet
        run: |
          git config user.name "garip-dunya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add haberler.json haberler.html app/veri.js app/foto
          git commit -m "Günlük havuz $(date +%F)" || echo "Değişiklik yok"
          git push
