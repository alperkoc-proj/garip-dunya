<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151311">
<title>Garip Dünya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#151311;--surface:#1E1B18;--surface-raised:#27231F;--line:#36302A;
  --ink:#F2ECE3;--ink-muted:#A79E92;--brand:#D4A857;--on-brand:#1C1915;
  --brand-soft:#3A3022;--on-brand-soft:#E8C987;--tuhaf:#D0734A;--siradan:#8A8178;
  --map-ground:#1F2622;--map-road:#3E4A42;
  --display:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}a:hover{color:var(--on-brand-soft)}
.app{max-width:440px;margin:0 auto;min-height:100dvh;padding:20px 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline}
.logo{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.sayac{font-size:13px;color:var(--ink-muted)}
.kart{background:var(--surface);border:2px solid var(--brand);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;animation:gel .35s ease-out}
.kart.tuhaf{border-color:var(--tuhaf)}.kart.siradan{border-color:var(--siradan)}
@keyframes gel{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.harita{position:relative;height:170px;background:var(--map-ground)}
.harita svg{display:block;width:100%;height:100%}
.road{stroke:var(--map-road);fill:none}
.pin{fill:var(--brand)}.kart.tuhaf .pin{fill:var(--tuhaf)}.kart.siradan .pin{fill:var(--siradan)}
.nabiz{fill:none;stroke:var(--brand);stroke-width:3;transform-origin:center;transform-box:fill-box;animation:nabiz 2s ease-out infinite}
.kart.tuhaf .nabiz{stroke:var(--tuhaf)}.kart.siradan .nabiz{stroke:var(--siradan)}
@keyframes nabiz{from{transform:scale(.4);opacity:.9}to{transform:scale(2.2);opacity:0}}
.etiket{position:absolute;font-size:12px;font-weight:600;background:#151311d9;color:var(--ink);padding:5px 10px;border-radius:999px}
.konum{left:12px;top:12px}.uzak{right:12px;bottom:10px;font-weight:500;color:var(--ink-muted)}
.govde{padding:18px;display:flex;flex-direction:column;gap:12px}
.ust{display:flex;align-items:center;gap:8px}
.rozet{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--on-brand-soft)}
.kart.tuhaf .rozet{background:#3A261C;color:#EBA27F}.kart.siradan .rozet{background:var(--surface-raised);color:var(--ink-muted)}
.punch{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.02;letter-spacing:-.015em;margin:0}
.baslik{font-size:15px;font-weight:600;margin:0;color:var(--ink)}
.ozet{font-size:15px;line-height:1.5;color:#D9D1C5;margin:0}
.orijinal{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.orijinal small{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-muted)}
.orijinal q{font-size:14px;line-height:1.45;font-style:italic;color:#E4DDD2;quotes:none}
.kaynak{font-size:13px}
.aksiyon{display:flex;gap:10px}
button{font:inherit;cursor:pointer}
.birincil{flex:1;height:48px;border:none;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.ikincil{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center}
.ikincil[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}
.sonraki{height:48px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:15px}
.bitti{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:40px 8px}
.bitti h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;margin:0}
.bitti p{margin:0;color:var(--ink-muted);line-height:1.5}
.saat{font-family:var(--display);font-size:28px;color:var(--brand)}
.pasaport{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;text-align:left}
.pasaport h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;color:var(--ink-muted)}
.damgalar{display:flex;flex-wrap:wrap;gap:8px}
.damga{font-size:13px;border:1px solid var(--brand);color:var(--on-brand-soft);padding:4px 10px;border-radius:999px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.goster{opacity:1}
.bos{color:var(--ink-muted);text-align:center;padding:60px 0}
</style>
</head>
<body>
<div class="app">
  <header><div class="logo">Garip Dünya</div><div class="sayac" id="sayac"></div></header>
  <main id="sahne"><p class="bos">Haberler yükleniyor…</p></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="veri.js" onerror="void 0"></script>
<script>
const LIMIT = 3;
const IST = [41.01, 28.98];
// Ülke merkezleri (yaklaşık), uzaklık satırı için
const ULKE = {"ABD":[39.8,-98.6],"Kanada":[56,-96],"Meksika":[23.6,-102.5],"Brezilya":[-10.8,-52.9],"Arjantin":[-34,-64],"Şili":[-35.7,-71.5],"Peru":[-9.2,-75],"Kolombiya":[4.6,-74.1],"Kosta Rika":[9.9,-84.1],"İngiltere":[52.4,-1.5],"İrlanda":[53.4,-8],"Fransa":[46.6,2.2],"Almanya":[51.2,10.4],"İtalya":[42.8,12.6],"İspanya":[40.4,-3.7],"Portekiz":[39.6,-8],"Belçika":[50.6,4.5],"Hollanda":[52.1,5.3],"İsviçre":[46.8,8.2],"Avusturya":[47.6,14.1],"Monako":[43.7,7.4],"Polonya":[52,19.1],"Estonya":[58.6,25],"İsveç":[62,15],"Norveç":[64.5,11],"Finlandiya":[64,26],"Danimarka":[56,10],"Yunanistan":[39,22],"Türkiye":[39,35],"Rusya":[61.5,105.3],"Ukrayna":[49,32],"Fas":[31.8,-7.1],"Mısır":[26.8,30.8],"Güney Afrika":[-30.6,22.9],"Nijerya":[9.1,8.7],"Kenya":[0,38],"Hindistan":[22,79],"Çin":[35.9,104.2],"Japonya":[36.2,138.3],"Güney Kore":[36.5,127.9],"Tayland":[15.9,100.9],"Vietnam":[14,108],"Endonezya":[-2.5,118],"Filipinler":[12.9,121.8],"Avustralya":[-25.3,133.8],"Yeni Zelanda":[-41,174],"Malezya":[4.2,102],"Singapur":[1.35,103.8]};
const km = (a,b) => { const r=x=>x*Math.PI/180, R=6371; const d1=r(b[0]-a[0]), d2=r(b[1]-a[1]); const h=Math.sin(d1/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(d2/2)**2; return Math.round(2*R*Math.asin(Math.sqrt(h))/100)*100; };

// Kalıcı kullanıcı durumu (tarayıcıda)
const depo = { al(k,v){ try{ return JSON.parse(localStorage.getItem(k)) ?? v; }catch{ return v; } }, koy(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };
const bugun = new Date().toLocaleDateString("sv-SE");
let uid = depo.al("gd_uid", null); if(!uid){ uid = Math.random().toString(36).slice(2); depo.koy("gd_uid", uid); }
let gorulen = new Set(depo.al("gd_gorulen", []));
let pasaport = depo.al("gd_pasaport", []);
let gunluk = depo.al("gd_gunluk", null);
let oylar = depo.al("gd_oylar", {});

// Kullanıcıya ve güne özel karıştırma: herkes farklı haber görür
function tohum(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
function karistir(liste, anahtar){ const r=tohum(anahtar), a=[...liste]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const kimlik = h => h.link || h.baslik;

function gunlukSec(havuz){
  if(gunluk && gunluk.tarih===bugun) return gunluk;
  // Nadirlik ağırlığı: efsanevi daha sık ama garantisiz
  const agirlik = h => h.nadirlik==="efsanevi"?3:h.nadirlik==="tuhaf"?2:1;
  const r = tohum(uid+bugun+"agirlik");
  const yeni = havuz.filter(h=>!gorulen.has(kimlik(h)));
  const aday = (yeni.length>=LIMIT?yeni:havuz).map(h=>({h,s:Math.pow(r(),1/agirlik(h))})).sort((a,b)=>b.s-a.s).map(x=>x.h);
  const secim = []; const ulkeler = new Set();
  for(const h of aday){ if(secim.length>=LIMIT) break; if(h.ulke && ulkeler.has(h.ulke) && aday.length>LIMIT*3) continue; secim.push(kimlik(h)); if(h.ulke) ulkeler.add(h.ulke); }
  gunluk = { tarih: bugun, ids: secim, sira: 0 }; depo.koy("gd_gunluk", gunluk); return gunluk;
}

function haritaSVG(anahtar){
  const r = tohum(anahtar); const w=392,h=170; let s="";
  for(let i=0;i<5;i++){ const y=r()*h; s+=`<path class="road" stroke-width="${2+Math.round(r()*2)}" d="M0 ${y.toFixed(0)} C${(w*.3).toFixed(0)} ${(y+r()*60-30).toFixed(0)} ${(w*.7).toFixed(0)} ${(y+r()*60-30).toFixed(0)} ${w} ${(y+r()*40-20).toFixed(0)}"/>`; }
  for(let i=0;i<4;i++){ const x=r()*w; s+=`<path class="road" stroke-width="2" d="M${x.toFixed(0)} 0 L${(x+r()*80-40).toFixed(0)} ${h}"/>`; }
  s+=`<path class="road" stroke-width="10" opacity=".7" d="M0 ${(h*.55+r()*30).toFixed(0)} C${w*.35} ${(h*.4).toFixed(0)} ${w*.6} ${(h*.85).toFixed(0)} ${w} ${(h*.6).toFixed(0)}"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Haberin geçtiği yerin temsili haritası">${s}
  <circle class="nabiz" cx="196" cy="78" r="12"/>
  <path class="pin" stroke="#151311" stroke-width="2" d="M196 92 C196 92 180 72 180 60 a16 16 0 0 1 32 0 C212 72 196 92 196 92 z"/><circle cx="196" cy="60" r="6" fill="#151311"/></svg>`;
}

const IK = {
  paylas:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>',
  ust:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H3V10z"/><path d="M7 10l4-8a3 3 0 0 1 3 3v4h6a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 18.6 21H7"/></svg>'
};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NADIR = {efsanevi:"Efsanevi",tuhaf:"Tuhaf","sıradan":"Sıradan"};

function goster(havuz){
  const g = gunlukSec(havuz); const sahne = document.getElementById("sahne");
  const harita = new Map(havuz.map(h=>[kimlik(h),h]));
  document.getElementById("sayac").textContent = g.sira < g.ids.length ? `Bugün ${g.sira+1} / ${g.ids.length}` : `Bugün ${g.ids.length} / ${g.ids.length}`;
  if(g.sira >= g.ids.length) return bittiEkrani(sahne);
  const h = harita.get(g.ids[g.sira]); if(!h){ g.sira++; depo.koy("gd_gunluk",g); return goster(havuz); }
  const id = kimlik(h); gorulen.add(id); depo.koy("gd_gorulen",[...gorulen]);
  if(h.ulke && !pasaport.includes(h.ulke)){ pasaport.push(h.ulke); depo.koy("gd_pasaport",pasaport); }
  const nadir = h.nadirlik==="efsanevi"?"":h.nadirlik==="tuhaf"?"tuhaf":"siradan";
  const yer = [h.sehir,h.ulke].filter(Boolean).join(", ");
  const uzak = ULKE[h.ulke] ? `İstanbul'dan ~${km(IST,ULKE[h.ulke]).toLocaleString("tr-TR")} km` : "";
  const oy = oylar[id];
  sahne.innerHTML = `<article class="kart ${nadir}">
    <div class="harita">${haritaSVG(id)}${yer?`<span class="etiket konum">${esc(yer)}</span>`:""}${uzak?`<span class="etiket uzak">${uzak}</span>`:""}</div>
    <div class="govde">
      <div class="ust"><span class="rozet">${NADIR[h.nadirlik]||"Sıradan"}</span></div>
      <h2 class="punch">${esc(h.punchline)}</h2>
      <p class="baslik">${esc(h.baslik_tr)}</p>
      <p class="ozet">${esc(h.ozet_tr)}</p>
      <div class="orijinal"><small>ORİJİNAL MANŞET</small><q>${esc(h.baslik)}</q></div>
      <a class="kaynak" href="${esc(h.link)}" target="_blank" rel="noopener">Kaynak: ${esc(h.yayinci)} · Haberin devamı</a>
    </div>
  </article>
  <div class="aksiyon" style="margin-top:14px">
    <button class="birincil" id="paylas">${IK.paylas}Paylaş</button>
    <button class="ikincil" id="begen" aria-label="Beğendim" aria-pressed="${oy===1}">${IK.ust}</button>
    <button class="ikincil" id="begenme" aria-label="Beğenmedim" aria-pressed="${oy===-1}"><span style="display:flex;transform:rotate(180deg)">${IK.ust}</span></button>
  </div>
  <button class="sonraki" id="sonraki" style="width:100%;margin-top:10px">${g.sira+1<g.ids.length?"Sonraki haber":"Bugünü bitir"}</button>`;
  document.getElementById("paylas").onclick = () => paylas(h);
  document.getElementById("begen").onclick = () => oyla(id,1,havuz);
  document.getElementById("begenme").onclick = () => oyla(id,-1,havuz);
  document.getElementById("sonraki").onclick = () => { g.sira++; depo.koy("gd_gunluk",g); goster(havuz); window.scrollTo({top:0}); };
}

function oyla(id,v,havuz){ oylar[id] = oylar[id]===v ? 0 : v; depo.koy("gd_oylar",oylar); goster(havuz); }

async function paylas(h){
  const metin = `${h.punchline}\n${h.ozet_tr}\n📍 ${[h.sehir,h.ulke].filter(Boolean).join(", ")}\n\nGarip Dünya'da gördüm.`;
  try{ if(navigator.share){ await navigator.share({title:"Garip Dünya", text:metin, url:h.link}); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(metin+"\n"+h.link); tost("Panoya kopyalandı"); }catch{ tost("Kopyalanamadı"); }
}
function tost(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("goster"); setTimeout(()=>t.classList.remove("goster"),1800); }

function bittiEkrani(sahne){
  const yarin = new Date(); yarin.setHours(24,0,0,0);
  const kalan = () => { const ms=yarin-new Date(); const s=Math.max(0,Math.floor(ms/1000)); return `${String(Math.floor(s/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };
  sahne.innerHTML = `<section class="bitti">
    <h2>Bugünlük bu kadar.</h2>
    <p>Dünya garip olmaya devam ediyor. Yeni haberlerin şu kadar sonra:</p>
    <div class="saat" id="saat">${kalan()}</div>
    <div class="pasaport"><h3>HABER PASAPORTUN · ${pasaport.length} ÜLKE</h3><div class="damgalar">${pasaport.map(u=>`<span class="damga">${esc(u)}</span>`).join("")||'<span style="color:var(--ink-muted)">Henüz damga yok.</span>'}</div></div>
  </section>`;
  clearInterval(window._saat); window._saat = setInterval(()=>{ const e=document.getElementById("saat"); if(e) e.textContent=kalan(); },1000);
}

async function basla(){
  let veri = window.HABERLER;
  if(!veri){ try{ veri = await (await fetch("haberler.json",{cache:"no-store"})).json(); }catch{} }
  const havuz = (veri && veri.gecen) || [];
  if(!havuz.length){ document.getElementById("sahne").innerHTML = '<p class="bos">Bugün için haber bulunamadı.</p>'; return; }
  goster(havuz);
}
basla();
</script>
</body>
</html>
