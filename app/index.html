<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151311">
<title>Garip Dünya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: bir arkadaştan gelen kartpostal; sakin, esprili, insan eli değmiş
   IDEA: her haber, dünyanın o köşesinden sana gönderilmiş bir kartpostal
   PICTURE: yerin gerçek fotoğrafı (serbest lisanslı), üstünde pul ve posta damgası
   COLOUR/TYPE: masa gibi koyu zemin, kâğıt kart, pirinç pul; Fraunces + Inter
   LAYOUT: tek sütun; ön yüz (foto) üstte, arka yüz (yazı) altta, eylemler sade metin */
:root{--masa:#151311;--kagit:#F1EADC;--kagit2:#E6DCC8;--murekkep:#1F1B16;--soluk:#6B6155;--cizgi:#CFC3AE;
  --pirinc:#C9A050;--toprak:#B8613C;--tas:#857B70;--damga:#3C5A7A;--atlas:#1F2622;--yol:#3E4A42;
  --display:Fraunces,Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--masa);color:#EDE5D8;font-family:var(--sans);-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;min-height:100dvh;padding:22px 20px 32px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.logo{font-family:var(--display);font-weight:600;font-size:21px}
.logo i{font-weight:400;color:#B8AE9F}
.sayac{font-size:13px;color:#A79E92}
/* kartpostal */
.kart{position:relative;background:var(--kagit);color:var(--murekkep);border-radius:4px;padding:12px 12px 20px;
  box-shadow:0 1px 0 #00000040,0 18px 40px -18px #000000b0;transform:rotate(-.6deg);animation:gel .45s cubic-bezier(.2,.8,.2,1)}
@keyframes gel{from{opacity:0;transform:translateY(16px) rotate(-2deg)}to{opacity:1;transform:rotate(-.6deg)}}
@media (prefers-reduced-motion:reduce){.kart{animation:none}}
.on{position:relative;aspect-ratio:4/3;background:var(--atlas);overflow:hidden;border-radius:2px}
.on img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.02)}
.on svg.harita{width:100%;height:100%;display:block}
.yol{stroke:var(--yol);fill:none}
.yer{position:absolute;left:12px;bottom:10px;font-family:var(--display);font-style:italic;font-size:22px;color:#FFF8EC;text-shadow:0 1px 8px #000000b0}
.atif{font-size:10.5px;line-height:1.3;color:var(--soluk);margin:6px 2px 0}
.atif a{color:var(--soluk)}
/* pul */
.pul{position:absolute;right:16px;top:-14px;width:80px;height:94px;padding:5px;transform:rotate(4deg);z-index:2;
  background:radial-gradient(circle at 5px 5px,#0000 2.6px,var(--pc) 3px) -5px -5px/10px 10px;--pc:var(--pirinc);color:#1F1B16;filter:drop-shadow(0 2px 3px #00000040)}
.pul.tuhaf{--pc:var(--toprak)}.pul.siradan{--pc:var(--tas);color:#F4EEE4}
.pul .ic{background:var(--pc);outline:1px solid #1F1B1655;outline-offset:-4px;height:100%;padding:8px 7px;display:flex;flex-direction:column;justify-content:space-between}
.pul.siradan .ic{outline-color:#F4EEE466}
.pul b{font-family:var(--display);font-weight:600;font-size:13px;line-height:1.05}
.pul small{font-size:9.5px;font-weight:600;letter-spacing:.04em}
/* posta damgası */
.damga{position:absolute;right:58px;top:30px;width:92px;height:92px;z-index:3;transform:rotate(-14deg);opacity:.78;pointer-events:none}
.damga circle{fill:none;stroke:var(--damga)}
.damga text{fill:var(--damga);font-family:var(--sans);font-weight:600;font-size:9px;letter-spacing:.06em}
/* arka yüz */
.arka{padding:18px 8px 0;display:flex;flex-direction:column;gap:12px}
.punch{font-family:var(--display);font-weight:600;font-size:clamp(30px,8.5vw,38px);line-height:1.02;letter-spacing:-.015em;margin:0;text-wrap:balance}
.ozet{font-size:16px;line-height:1.55;margin:0;color:#2E2822}
.manset{border-top:1px dashed var(--cizgi);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.manset span{font-size:12px;color:var(--soluk)}
.manset q{font-family:var(--display);font-style:italic;font-size:15px;line-height:1.4;color:#3A332B;quotes:none}
.kaynak{font-size:13px;color:#7A5A1C}
/* eylemler */
.eylem{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:0 4px}
.eylem button{font:500 15px var(--sans);min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #3A342D;background:transparent;color:#EDE5D8;cursor:pointer}
.eylem button[aria-pressed="true"]{border-color:var(--pirinc);color:var(--pirinc)}
.eylem .ana{background:#EDE5D8;color:#151311;border-color:#EDE5D8}
.eylem .sonra{margin-left:auto;border:none;padding:0 4px;color:#C9BFB0;text-decoration:underline;text-underline-offset:4px}
button:focus-visible,a:focus-visible{outline:2px solid var(--pirinc);outline-offset:3px}
/* gün sonu */
.son{display:flex;flex-direction:column;gap:14px;padding:28px 4px}
.son h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.05;margin:0}
.son p{margin:0;color:#B8AE9F;line-height:1.55}
.saat{font-family:var(--display);font-size:26px;color:var(--pirinc)}
.koleksiyon{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:6px}
.mini{aspect-ratio:5/6;background:var(--pirinc);border:3px dotted #151311;color:#1F1B16;padding:6px;font-family:var(--display);font-size:11px;font-weight:600;line-height:1.1;display:flex;align-items:flex-end;
}
.mini:nth-child(3n+2){background:var(--toprak)}.mini:nth-child(3n){background:#8FA08A}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#EDE5D8;color:#151311;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.goster{opacity:1}
.bos{color:#A79E92;text-align:center;padding:60px 0}
</style>
</head>
<body>
<div class="app">
  <header><div class="logo">Garip Dünya <i>kartpostal</i></div><div class="sayac" id="sayac"></div></header>
  <main id="sahne"><p class="bos">Kartpostallar yolda…</p></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="veri.js"></script>
<script>
{
const LIMIT = 3, IST = [41.01, 28.98];
const ULKE = {"ABD":[39.8,-98.6],"Kanada":[56,-96],"Meksika":[23.6,-102.5],"Brezilya":[-10.8,-52.9],"Arjantin":[-34,-64],"Şili":[-35.7,-71.5],"Peru":[-9.2,-75],"Kolombiya":[4.6,-74.1],"Kosta Rika":[9.9,-84.1],"İngiltere":[52.4,-1.5],"İrlanda":[53.4,-8],"Fransa":[46.6,2.2],"Almanya":[51.2,10.4],"İtalya":[42.8,12.6],"İspanya":[40.4,-3.7],"Portekiz":[39.6,-8],"Belçika":[50.6,4.5],"Hollanda":[52.1,5.3],"İsviçre":[46.8,8.2],"Avusturya":[47.6,14.1],"Monako":[43.7,7.4],"Polonya":[52,19.1],"Estonya":[58.6,25],"İsveç":[62,15],"Norveç":[64.5,11],"Finlandiya":[64,26],"Danimarka":[56,10],"Yunanistan":[39,22],"Türkiye":[39,35],"Rusya":[61.5,105.3],"Ukrayna":[49,32],"Fas":[31.8,-7.1],"Mısır":[26.8,30.8],"Güney Afrika":[-30.6,22.9],"Nijerya":[9.1,8.7],"Kenya":[0,38],"Hindistan":[22,79],"Çin":[35.9,104.2],"Japonya":[36.2,138.3],"Güney Kore":[36.5,127.9],"Tayland":[15.9,100.9],"Vietnam":[14,108],"Endonezya":[-2.5,118],"Filipinler":[12.9,121.8],"Avustralya":[-25.3,133.8],"Yeni Zelanda":[-41,174],"Malezya":[4.2,102],"Singapur":[1.35,103.8]};
const km = (a,b) => { const r=x=>x*Math.PI/180; const h=Math.sin(r(b[0]-a[0])/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2; return Math.round(12742*Math.asin(Math.sqrt(h))/100)*100; };
const depo = { al(k,v){ try{ return JSON.parse(localStorage.getItem(k)) ?? v; }catch{ return v; } }, koy(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };
const bugun = new Date().toLocaleDateString("sv-SE");
let uid = depo.al("gd_uid", null); if(!uid){ uid = Math.random().toString(36).slice(2); depo.koy("gd_uid", uid); }
const gorulen = new Set(depo.al("gd_gorulen", []));
const pasaport = depo.al("gd_pasaport", []);
const oylar = depo.al("gd_oylar", {});
let gunluk = depo.al("gd_gunluk", null);

function tohum(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
const kimlik = h => h.link || h.baslik;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NADIR = {efsanevi:["Efsanevi",""],tuhaf:["Tuhaf","tuhaf"],"sıradan":["Sıradan","siradan"]};

function gunlukSec(havuz){
  if(gunluk && gunluk.tarih===bugun) return gunluk;
  const ag = h => h.nadirlik==="efsanevi"?3:h.nadirlik==="tuhaf"?2:1;
  const r = tohum(uid+bugun);
  const yeni = havuz.filter(h=>!gorulen.has(kimlik(h)));
  const aday = (yeni.length>=LIMIT?yeni:havuz).map(h=>({h,s:Math.pow(r(),1/ag(h))})).sort((a,b)=>b.s-a.s).map(x=>x.h);
  const secim=[], ulkeler=new Set();
  for(const h of aday){ if(secim.length>=LIMIT) break; if(h.ulke && ulkeler.has(h.ulke) && aday.length>LIMIT*3) continue; secim.push(kimlik(h)); if(h.ulke) ulkeler.add(h.ulke); }
  gunluk = {tarih:bugun, ids:secim, sira:0}; depo.koy("gd_gunluk",gunluk); return gunluk;
}

function harita(anahtar){
  const r=tohum(anahtar), w=400, h=300; let s="";
  for(let i=0;i<6;i++){ const y=r()*h; s+=`<path class="yol" stroke-width="${2+Math.round(r()*2)}" d="M0 ${y|0} C${w*.3|0} ${(y+r()*80-40)|0} ${w*.7|0} ${(y+r()*80-40)|0} ${w} ${(y+r()*50-25)|0}"/>`; }
  for(let i=0;i<5;i++){ const x=r()*w; s+=`<path class="yol" stroke-width="2" d="M${x|0} 0 L${(x+r()*90-45)|0} ${h}"/>`; }
  return `<svg class="harita" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Haberin geçtiği yerin temsili haritası">${s}<circle cx="200" cy="140" r="9" fill="#C9A050"/></svg>`;
}

function damga(yer){
  const t = new Date().toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"}).toLocaleUpperCase("tr-TR");
  const ust = esc((yer||"DÜNYA").toLocaleUpperCase("tr-TR").slice(0,18));
  return `<svg class="damga" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="43" stroke-width="2"/><circle cx="46" cy="46" r="31" stroke-width="1.2"/>
  <path id="ust" d="M10 46 a36 36 0 0 1 72 0" fill="none"/><path id="alt" d="M14 50 a32 32 0 0 0 64 0" fill="none"/>
  <text><textPath href="#ust" startOffset="50%" text-anchor="middle">${ust}</textPath></text>
  <text><textPath href="#alt" startOffset="50%" text-anchor="middle">GARİP DÜNYA</textPath></text>
  <text x="46" y="50" text-anchor="middle" style="font-size:10px">${esc(t)}</text></svg>`;
}

function goster(havuz){
  const g = gunlukSec(havuz), sahne = document.getElementById("sahne");
  const ix = new Map(havuz.map(h=>[kimlik(h),h]));
  document.getElementById("sayac").textContent = `${Math.min(g.sira+1,g.ids.length)} / ${g.ids.length}`;
  if(g.sira >= g.ids.length) return son(sahne);
  const h = ix.get(g.ids[g.sira]); if(!h){ g.sira++; depo.koy("gd_gunluk",g); return goster(havuz); }
  const id = kimlik(h); gorulen.add(id); depo.koy("gd_gorulen",[...gorulen]);
  if(h.ulke && !pasaport.includes(h.ulke)){ pasaport.push(h.ulke); depo.koy("gd_pasaport",pasaport); }
  const [nadirAd, nadirSinif] = NADIR[h.nadirlik] || NADIR["sıradan"];
  const yer = [h.sehir,h.ulke].filter(Boolean).join(", ");
  const uzak = ULKE[h.ulke] ? `${km(IST,ULKE[h.ulke]).toLocaleString("tr-TR")} km` : "uzakta";
  const f = h.foto; const src = f ? (f.dosya || f.url) : "";
  const on = src ? `<img src="${esc(src)}" alt="${esc(f.yer||yer)} manzarası" onerror="this.replaceWith(document.createRange().createContextualFragment(window._harita))">` : harita(id);
  window._harita = harita(id);
  const atif = f ? `<p class="atif">Fotoğraf: ${esc(f.yer||"")}${f.yazar?` · ${esc(f.yazar)}`:""} · <a href="${esc(f.sayfa)}" target="_blank" rel="noopener">${esc(f.lisans)}, Wikimedia</a>. Haberin kendi fotoğrafı değildir.</p>` : `<p class="atif">Temsili harita.</p>`;
  const oy = oylar[id];
  sahne.innerHTML = `<article class="kart">
    <div class="pul ${nadirSinif}"><div class="ic"><small>${esc(nadirAd.toLocaleUpperCase("tr-TR"))}</small><b>${esc(h.ulke||"Dünya")}</b><small>${esc(uzak)}</small></div></div>
    ${damga(h.sehir||h.ulke)}
    <div class="on">${on}${yer?`<span class="yer">${esc(yer)}</span>`:""}</div>
    ${atif}
    <div class="arka">
      <h2 class="punch">${esc(h.punchline)}</h2>
      <p class="ozet">${esc(h.ozet_tr)}</p>
      <div class="manset"><span>Orijinal manşet</span><q>${esc(h.baslik)}</q></div>
      <a class="kaynak" href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.yayinci)} · haberin devamı</a>
    </div>
  </article>
  <div class="eylem">
    <button class="ana" id="paylas">Gönder</button>
    <button id="begen" aria-pressed="${oy===1}">Güldüm</button>
    <button id="begenme" aria-pressed="${oy===-1}">Pek değil</button>
    <button class="sonra" id="sonraki">${g.sira+1<g.ids.length?"Sıradaki":"Bitir"}</button>
  </div>`;
  document.getElementById("paylas").onclick = () => paylas(h);
  document.getElementById("begen").onclick = () => oyla(id,1,havuz);
  document.getElementById("begenme").onclick = () => oyla(id,-1,havuz);
  document.getElementById("sonraki").onclick = () => { g.sira++; depo.koy("gd_gunluk",g); goster(havuz); window.scrollTo({top:0}); };
}
function oyla(id,v,havuz){ oylar[id] = oylar[id]===v?0:v; depo.koy("gd_oylar",oylar); goster(havuz); }
async function paylas(h){
  const metin = `${h.punchline}\n${h.ozet_tr}\n📍 ${[h.sehir,h.ulke].filter(Boolean).join(", ")}\n(Garip Dünya'dan bir kartpostal)`;
  try{ if(navigator.share){ await navigator.share({title:"Garip Dünya", text:metin, url:h.link}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(metin+"\n"+h.link); tost("Kopyalandı, istediğin yere yapıştır"); }catch{ tost("Kopyalanamadı"); }
}
function tost(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("goster"); setTimeout(()=>t.classList.remove("goster"),1900); }
function son(sahne){
  const yarin=new Date(); yarin.setHours(24,0,0,0);
  const kalan=()=>{ const s=Math.max(0,Math.floor((yarin-new Date())/1000)); return `${String(s/3600|0).padStart(2,"0")}:${String(s%3600/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };
  sahne.innerHTML = `<section class="son">
    <h2>Bugünkü kartpostalların geldi.</h2>
    <p>Yarın sabah dünyanın başka köşelerinden yenileri gelecek.</p>
    <div class="saat" id="saat">${kalan()}</div>
    <p>Pul koleksiyonun · ${pasaport.length} ülke</p>
    <div class="koleksiyon">${pasaport.map(u=>`<div class="mini">${esc(u)}</div>`).join("")}</div>
  </section>`;
  clearInterval(window._saat); window._saat=setInterval(()=>{ const e=document.getElementById("saat"); if(e) e.textContent=kalan(); },1000);
}
(async()=>{
  let veri = window.HABERLER;
  if(!veri){ try{ veri = await (await fetch("haberler.json",{cache:"no-store"})).json(); }catch{} }
  const havuz = (veri && veri.gecen) || [];
  if(!havuz.length){ document.getElementById("sahne").innerHTML='<p class="bos">Bugün kartpostal gelmedi.</p>'; return; }
  goster(havuz);
})();
}
</script>
</body>
</html>
